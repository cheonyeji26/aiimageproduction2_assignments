<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Visionary | Space Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <div id="world">
    <div id="stars"></div>
    
    <div id="player">
        <div id="player-light"></div>
        <span class="nickname">Yeji</span>
    </div>

    <div class="portal about-me" style="left: 2200px; top: 2500px;" 
         data-title="About Yeji" 
         data-desc="안녕하세요! AI와 예술의 경계를 탐구하는 개발자 예지입니다.">
        <div class="about-visual"></div>
        <div class="portal-label">Introduce</div>
    </div>

    <div class="portal" style="left: 2800px; top: 2500px;" 
         data-title="Neural Landscapes" data-desc="AI 초현실 풍경 작업입니다." data-img="work1.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 01</div>
    </div>

    <div class="portal" style="left: 2500px; top: 2800px;" 
         data-title="Digital Flesh" data-desc="유기적 질감 실험입니다." data-img="work2.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 02</div>
    </div>

    <div class="portal" style="left: 2500px; top: 2200px;" 
         data-title="Temporal Loops" data-desc="AI 비디오 실험작입니다." data-img="work1.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 03</div>
    </div>
</div>

    <div id="overlay" class="hidden">
        <div class="overlay-content">
            <button id="close-btn">Close [X]</button>
            <h2 id="project-title">Project Name</h2>
            <p id="project-desc">Description goes here...</p>
            <div class="media-placeholder">이미지 로딩 중...</div>
        </div>
    </div>

    <div class="instructions">이동: [화살표/WASD] | 프로젝트 열기: [E] 또는 [Enter]</div>
</div>

<script src="game.js"></script>
</body>
</html>
