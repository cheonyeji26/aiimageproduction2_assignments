<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imweb Style Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">MY THEME</div>
        <nav>
            <ul>
                <li><a href="#">쇼핑몰</a></li>
                <li><a href="#">기업용</a></li>
                <li><a href="#">포트폴리오</a></li>
                <li><a href="#" class="btn-trial">무료 시작하기</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="title-section">
            <h1>브랜드의 시작, 테마로 완성하세요</h1>
            <p>전문 디자이너가 제작한 고퀄리티 템플릿을 만나보세요.</p>
        </section>

        <div class="grid">
            <div class="card">
                <div class="card-img">
                    <img src="https://via.placeholder.com/400x300" alt="Theme 1">
                    <div class="overlay">자세히 보기</div>
                </div>
                <div class="card-info">
                    <h3>Modern Studio</h3>
                    <p>미니멀한 감성의 포트폴리오 테마</p>
                </div>
            </div>
            <div class="card">
                <div class="card-img">
                    <img src="https://via.placeholder.com/400x300" alt="Theme 2">
                    <div class="overlay">자세히 보기</div>
                </div>
                <div class="card-info">
                    <h3>Organic Shop</h3>
                    <p>깨끗한 느낌의 커머스 테마</p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
