<!DOCTYPE html>

<head>

    <nav class="navbar">

                <button class="filter-btn active" data-filter="all">전체</button>

                    </div>
                </div>
                <div class="portfolio-item uiux">
                    <div class="img-box">
                        <img src="./assets/grid_02.jpg" alt="작품3">
                        <div class="overlay">
