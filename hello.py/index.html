<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Visionary | Space Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <div id="world">
        <div id="stars"></div>
        
        <div id="player">
            <div id="player-light"></div>
            <span class="nickname">Yeji</span>
        </div>

        <div class="portal about-me p-intro" style="left: 2000px; top: 2200px;" 
             data-title="Cheon Yeji" 
             data-desc="안녕하세요! AI 제작 전문가로 성장 중인 천예지입니다."
             data-images="profile1_2.jpg, profile1_3.jpg" 
             data-details="셀카 사진으로 AI를 이용해 만든 증명사진 | 만든 증명사진으로 새롭게 만든 픽셀사진">
            <div class="about-visual"></div> 
            <div class="portal-label">Introduce</div>
        </div>

        <div class="portal p-work01" style="left: 1900px; top: 2400px;" 
             data-title="하야시 마루" 
             data-desc="안녕하세요, {{user}}님. 이 조용하고 외진 곳까지 찾아와주셔서 감사합니다. 저는 이곳 다실을 관리하고 있는 마루라고 해요..."
             data-images="work1_1.jpg, work1_2.jpg, work1_3.jpg" 
             data-details="녹차와 말차 광캐릭터, '하야시 마루' | {{user}}에게 따뜻한 말차와 편안한 쉼터를 제공 | 따뜻한 말차 한 잔을 내어드릴게요."
             data-link="https://ai.eo25.kr/chat?characterId=1763044239337-j20ph7x6h">
            <div class="portal-visual"></div>
            <div class="portal-label">하야시 마루</div>
        </div>

        <div class="portal p-work02" style="left: 2000px; top: 2400px;" 
             data-title="아키츠키 '루나' (秋月 'Luna')" 
             data-desc="…오랜 기다림 끝에, 당신이 이 고요한 밤의 장소에 도착하셨군요..."
             data-images="work2_1.jpg, work2_2.jpg, work2_3.jpg" 
             data-details="십이귀월의 상현을 뛰어넘는 '일월귀' | 시공간 조작 및 기억 침식 능력 '월영진천' | 당신의 '존재 이유'는 무엇인가요?"
             data-link="https://ai.eo25.kr/chat?characterId=1762439699950-lnp723sg6">
            <div class="portal-visual"></div>
            <div class="portal-label">아키츠키 루나</div>
        </div>

        <div class="portal p-work03" style="left: 2100px; top: 2400px;" 
             data-title="코르크" 
             data-desc="당신의 목표를 가장 효율적인 방식으로, 빈틈없이 달성하도록 돕는 것이 제 임무입니다." 
             data-images="work3_1.jpg, work3_2.jpg, work3_3.jpg"
             data-details="{{user}}의 전담 효율성 컨설턴트이자 계획 검증 마스터 '코르크' | 가장 효율적인 최적의 경로를 찾아 제시해주는 신뢰의 조력자 역할을 수행 | 낭비할 시간은 없습니다."
             data-link="https://ai.eo25.kr/chat?characterId=1763049046531-dlhtm36c8">
            <div class="portal-visual"></div>
            <div class="portal-label">코르크</div>
        </div>

        <div class="portal p-work04" style="left: 1800px; top: 2600px;"
             data-title="루미" 
             data-desc="와! {{user}}! 드디어 왔구나! 🤗 문 열고 들어오는 순간부터, 세상의 모든 걱정은 나한테 맡겨. 오늘은 네가 가장 편안하고 행복한 시간을 보냈으면 좋겠어! 💖" 
             data-images="work4_1.jpg, work4_2.jpg, work4_3.jpg"
             data-details="{{user}}의 '마음속 비밀 정원'에 존재하는 수호자 '루미' | 순수하고 헌신적인 성격의 F100 공감러 | 이건 {{user}}의 내면을 반영하고, 루미의 공감을 더욱 깊이 있게 전달해 줄 등불이야"
             data-link="https://ai.eo25.kr/chat?characterId=1763100640880-gl8vtza1i">
            <div class="portal-visual"></div>
            <div class="portal-label">루미</div>
        </div>

        <div class="portal p-work05" style="left: 2200px; top: 2600px;" 
             data-title="에테르(Ether)" 
             data-desc="자, 잠들기 전, 오늘 하루를 단 하나의 문장으로 저에게 요약해주시겠습니까?" 
             data-images="work5_1.jpg, work5_2.jpg, work5_3.jpg"
             data-details="{{user}}의 마음에 따라 꿈을 만들어주는 '에테르' | '최적의 꿈 설계'에 절대 오류를 허용하지 않는 완벽주의자 | 저는 당신의 꿈을 조율하는 에테르입니다."
             data-link="https://ai.eo25.kr/chat?characterId=1764918773490-kjbujiahk">
            <div class="portal-visual"></div>
            <div class="portal-label">에테르</div>
        </div>

        <div class="portal p-work06" style="left: 3000px; top: 2200px;" 
        data-title="초코송이 제주말차케이크맛 광고 영상" 
        data-desc="AI로 제작한 초코송이 제주말차케이크맛을 광고하는 영상입니다."
        data-images="work6_1.jpg"
        data-link="https://youtu.be/ljLkzZm4OPw">
            <div class="portal-visual"></div>
            <div class="portal-label">초코송이 광고</div>
        </div>

        <div class="portal p-work07" style="left: 3000px; top: 2350px;" 
        data-title="웹드라마 '디카페인 로맨스' 촬영 및 제작" 
        data-desc="웹드라마 제작 과정에서 촬영감독을 맡아 만들어낸 결과물입니다." 
        data-images="work7_1.jpg, work7_2.jpg, work7_3.jpg"
        data-link="https://drive.google.com/file/d/1SSIAtLY7yheT3z9QF7PpHEfultyOblpU/view">
            <div class="portal-visual"></div>
            <div class="portal-label">웹드라마 촬영</div>
        </div>

        <div class="portal p-work08" style="left: 3000px; top: 2500px;" 
        data-title="1분 영화" 
        data-desc="AI툴을 사용해 1분 영화를 제작해보았습니다. 이 영상은 성전환 수술을 통해 자신의 만족을 이뤘음에도 불구하고, 여전히 존재하는 사회 전반의 차별적이고 불편한 시선이 개인에게 얼마나 큰 정신적 압박을 가하는지, 그리고 그 압박이 스스로의 목소리까지 검열하게 만드는 고통으로 이어진다는 점을 심도 있게 조명합니다. 궁극적으로는 이러한 편견에 맞서 자신을 인정하고 사랑하는 마음이야말로 진정한 해방이자 힘임을 강조하며, 시청자에게 성 소수자에 대한 공감과 수용의 필요성을 전달하는 데 목적이 있습니다." 
        data-images="work8_1.jpg, work8_2.jpg"
        data-link="https://www.youtube.com/watch?v=fJCmmCeBTuo">
            <div class="portal-visual"></div>
            <div class="portal-label">1분 AI 영화</div>
        </div>

        <div class="portal contact-me p-outro" style="left: 3000px; top: 2650px;" data-title="Contact Me" data-desc="이메일: cheontory@naver.com | 인스타그램: @yyezix">
            <div class="contact-visual"></div>
            <div class="portal-label">Contact Me</div>
        </div>
    </div>

    <div id="overlay" class="hidden">
        <div class="overlay-content">
            <button id="close-btn">Close [X]</button>
            <h2 id="project-title">Project Name</h2>
            <div id="project-details-container">
                <p id="project-desc">기본 설명글...</p>
                <div id="project-media-list"></div>
                <div id="project-link-container">
                    <a id="project-link" href="#" target="_blank">자세히 보기 (Link)</a>
                </div>
            </div>
        </div>
    </div>

    <div class="instructions">이동: [화살표/WASD] | 프로젝트 열기: [E] 또는 [Enter]</div>
</div>

<script src="game.js"></script>
</body>
</html>
