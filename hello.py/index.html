<!DOCTYPE html>
<html>
<head>
  <title>AI Production Archive</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/force-graph"></script>
</head>
<body>
  <div id="graph"></div>
  
  <div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content">
      <img id="modal-img" src="" alt="">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
    </div>
  </div>

  <script>
    // 데이터 설정 (여기서 T1, T2 테마를 연결합니다)
    const gData = {
      nodes: [
        { id: 'Me', name: 'CORE ARTIST', img: 'profile.png', color: '#ff007f', size: 12, desc: 'AI 아티스트 소개글' },
        { id: 'T1', name: 'CHARACTER', color: '#00f2ff', size: 8 },
        { id: 'T2', name: 'ENVIRONMENT', color: '#7cfc00', size: 8 },
        { id: 'Proj1', name: 'NEURAL CITY', img: 'work1.jpg', color: '#00f2ff', size: 10, desc: '캐릭터 작품 설명' }
      ],
      links: [
        { source: 'Me', target: 'T1' },
        { source: 'Me', target: 'T2' },
        { source: 'T1', target: 'Proj1' } // 테마에 작품 연결!
      ]
    };

    const Graph = ForceGraph()
      (document.getElementById('graph'))
        .graphData(gData)
        .backgroundColor('#000000')
        .nodeCanvasObject((node, ctx, globalScale) => {
          const size = node.size;
          ctx.save();
          // 네온 효과
          ctx.shadowBlur = 15 / globalScale;
          ctx.shadowColor = node.color;
          // 사각형 그리기
          ctx.fillStyle = '#111';
          ctx.fillRect(node.x - size, node.y - size, size * 2, size * 2);
          ctx.strokeStyle = node.color;
          ctx.lineWidth = 1;
          ctx.strokeRect(node.x - size, node.y - size, size * 2, size * 2);
          
          // 이미지 그리기
          if (node.img) {
            const img = new Image();
            img.src = node.img;
            ctx.drawImage(img, node.x - size, node.y - size, size * 2, size * 2);
          }
          ctx.restore();

          // 텍스트 라벨
          ctx.font = `${4}px Sans-Serif`;
          ctx.fillStyle = 'white';
          ctx.textAlign = 'center';
          ctx.fillText(node.name, node.x, node.y + size + 5);
        })
        .onNodeClick(node => {
          if(node.img) openModal(node);
        });

    function openModal(node) {
      document.getElementById('modal').style.display = 'flex';
      document.getElementById('modal-img').src = node.img;
      document.getElementById('modal-title').innerText = node.name;
      document.getElementById('modal-desc').innerText = node.desc || '';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
