<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Visionary | Space Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <div id="world">
    <div id="stars"></div>
    
    <div id="player">
        <div id="player-light"></div>
        <span class="nickname">Yeji</span>
    </div>

    <div class="portal about-me" style="left: 2000px; top: 2200px;" data-title="About Yeji" data-desc="안녕하세요! AI 비전공자에서 전문가로 성장 중인 예지입니다.">
        <div class="about-visual"></div>
        <div class="portal-label">Introduce</div>
    </div>
    <div class="portal" style="left: 1900px; top: 2400px;" data-title="Work 01" data-desc="AI 프로젝트 1" data-img="work1.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 01</div>
    </div>
    <div class="portal" style="left: 2100px; top: 2400px;" data-title="Work 02" data-desc="AI 프로젝트 2" data-img="work2.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 02</div>
    </div>
    <div class="portal" style="left: 1800px; top: 2600px;" data-title="Work 03" data-desc="AI 프로젝트 3" data-img="work1.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 03</div>
    </div>
    <div class="portal" style="left: 2200px; top: 2600px;" data-title="Work 04" data-desc="AI 프로젝트 4" data-img="work2.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 04</div>
    </div>

    <div class="portal" style="left: 3000px; top: 2200px;" data-title="Work 05" data-desc="AI 프로젝트 5" data-img="work1.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 05</div>
    </div>
    <div class="portal" style="left: 3000px; top: 2400px;" data-title="Work 06" data-desc="AI 프로젝트 6" data-img="work2.jpg">
        <div class="portal-visual"></div>
        <div class="portal-label">Work 06</div>
    </div>
    <div class="portal contact-me" style="left: 3000px; top: 2650px;" data-title="Contact Me" data-desc="이메일: yeji@example.com | 더 많은 작업은 인스타그램에서 확인하세요!">
        <div class="contact-visual"></div>
        <div class="portal-label">Contact Me</div>
    </div>
</div>

    <div id="overlay" class="hidden">
        <div class="overlay-content">
            <button id="close-btn">Close [X]</button>
            <h2 id="project-title">Project Name</h2>
            <p id="project-desc">Description goes here...</p>
            <div class="media-placeholder">이미지 로딩 중...</div>
        </div>
    </div>

    <div class="instructions">이동: [화살표/WASD] | 프로젝트 열기: [E] 또는 [Enter]</div>
</div>

<script src="game.js"></script>
</body>
</html>
