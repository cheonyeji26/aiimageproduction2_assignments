<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Visionary | Space Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <div id="world">
        <div id="stars"></div>
        
        <div id="player">
            <div id="player-light"></div>
            <span class="nickname">Yeji</span>
        </div>

        <div class="portal about-me p-intro" style="left: 2000px; top: 2200px;" 
             data-title="Cheon Yeji" 
             data-desc="안녕하세요! AI 제작 전문가로 성장 중인 천예지입니다."
             data-images="profile1_2.jpg, profile1_3.jpg" 
             data-details="셀카 사진으로 AI를 이용해 만든 증명사진 | 만든 증명사진으로 새롭게 만든 픽셀사진">
            <div class="about-visual"></div> 
            <div class="portal-label">Introduce</div>
        </div>

        <div class="portal p-work01" style="left: 1900px; top: 2400px;" 
             data-title="하야시 마루" 
             data-desc="안녕하세요, {{user}}님. 이 조용하고 외진 곳까지 찾아와주셔서 감사합니다. 저는 이곳 다실을 관리하고 있는 마루라고 해요..."
             data-images="work1_1.jpg, work1_2.jpg, work1_3.jpg" 
             data-details="녹차와 말차 광캐릭터, '하야시 마루' | {{user}}에게 따뜻한 말차와 편안한 쉼터를 제공 | 따뜻한 말차 한 잔을 내어드릴게요."
             data-link="https://ai.eo25.kr/chat?characterId=1763044239337-j20ph7x6h">
            <div class="portal-visual"></div>
            <div class="portal-label">하야시 마루</div>
        </div>

        <div class="portal p-work02" style="left: 2000px; top: 2400px;" 
             data-title="아키츠키 '루나' (秋月 'Luna')" 
             data-desc="…오랜 기다림 끝에, 당신이 이 고요한 밤의 장소에 도착하셨군요..."
             data-images="work2_1.jpg, work2_2.jpg, work2_3.jpg" 
             data-details="십이귀월의 상현을 뛰어넘는 '일월귀' | 시공간 조작 및 기억 침식 능력 '월영진천' | 당신의 '존재 이유'는 무엇인가요?"
             data-link="https://ai.eo25.kr/chat?characterId=1762439699950-lnp723sg6">
            <div class="portal-visual"></div>
            <div class="portal-label">아키츠키 루나</div>
        </div>

        <div class="portal p-work03" style="left: 2100px; top: 2400px;" 
             data-title="코르크" 
             data-desc="당신의 목표를 가장 효율적인 방식으로, 빈틈없이 달성하도록 돕는 것이 제 임무입니다." 
             data-images="work3_1.jpg, work3_2.jpg, work3_3.jpg"
             data-details="{{user}}의 전담 효율성 컨설턴트이자 계획 검증 마스터 '코르크' | 가장 효율적인 최적의 경로를 찾아 제시해주는 신뢰의 조력자 역할을 수행 | 낭비할 시간은 없습니다."
             data-link="https://ai.eo25.kr/chat?characterId=1763049046531-dlhtm36c8">
            <div class="portal-visual"></div>
            <div class="portal-label">코르크</div>
        </div>

        <div class="portal p-work04" style="left: 1800px; top: 2600px;" data-title="Char 04" data-desc="AI 프로젝트 4" data-images="work3.jpg">
            <div class="portal-visual"></div>
            <div class="portal-label">루미</div>
        </div>

        <div class="portal p-work05" style="left: 2200px; top: 2600px;" data-title="Char 05" data-desc="AI 프로젝트 5" data-images="work4.jpg">
            <div class="portal-visual"></div>
            <div class="portal-label">에테르</div>
        </div>

        <div class="portal p-work06" style="left: 3000px; top: 2200px;" data-title="AI 광고" data-desc="AI 프로젝트 6" data-images="work1.jpg">
            <div class="portal-visual"></div>
            <div class="portal-label">초코송이 말차맛 광고 영상</div>
        </div>

        <div class="portal p-work07" style="left: 3000px; top: 2350px;" data-title="웹드라마 촬영감독" data-desc="AI 프로젝트 7" data-images="work2.jpg">
            <div class="portal-visual"></div>
            <div class="portal-label">'디카페인 로맨스' 촬영</div>
        </div>

        <div class="portal p-work08" style="left: 3000px; top: 2500px;" data-title="1분 영화" data-desc="AI 프로젝트 8" data-images="work4.jpg">
            <div class="portal-visual"></div>
            <div class="portal-label">1분 가량의 AI 영화 만들기</div>
        </div>

        <div class="portal contact-me p-outro" style="left: 3000px; top: 2650px;" data-title="Contact Me" data-desc="이메일: cheontory@naver.com | 인스타그램: @yyezix">
            <div class="contact-visual"></div>
            <div class="portal-label">Contact Me</div>
        </div>
    </div>

    <div id="overlay" class="hidden">
        <div class="overlay-content">
            <button id="close-btn">Close [X]</button>
            <h2 id="project-title">Project Name</h2>
            <div id="project-details-container">
                <p id="project-desc">기본 설명글...</p>
                <div id="project-media-list"></div>
                <div id="project-link-container">
                    <a id="project-link" href="#" target="_blank">자세히 보기 (Link)</a>
                </div>
            </div>
        </div>
    </div>

    <div class="instructions">이동: [화살표/WASD] | 프로젝트 열기: [E] 또는 [Enter]</div>
</div>

<script src="game.js"></script>
</body>
</html>
